<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="harme-logo-title">
  <title id="harme-logo-title">Harme Medical Center</title>

  <!--
    Full logo, including the wordmark. Use this where the mark is rendered at
    roughly 96px or larger; below that the wordmark stops being readable and
    public/images/logo-mark.svg is the better choice.

    The intrinsic width/height of the original file were "100%", which makes an
    <img> collapse in some renderers; sizing is left to the viewBox and CSS.
  -->

  <!-- Outer light border & background circle -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF" stroke="#ECECEC" stroke-width="2"/>

  <!-- Left green frame -->
  <path d="M 247,72 L 72,250 L 247,428"
        fill="none"
        stroke="#009E2B"
        stroke-width="38"
        stroke-linecap="butt"
        stroke-linejoin="round"/>

  <!-- Right blue frame -->
  <path d="M 253,72 L 428,250 L 253,428"
        fill="none"
        stroke="#0052CC"
        stroke-width="38"
        stroke-linecap="butt"
        stroke-linejoin="round"/>

  <!-- Text: HARME -->
  <text x="250" y="215"
        text-anchor="middle"
        fill="#009E2B"
        font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"
        font-weight="bold"
        font-size="50"
        letter-spacing="2">HARME</text>

  <!-- ECG / heartbeat pulse line -->
  <path d="M 175,300
           L 215,300
           L 222,312
           L 229,285
           L 236,320
           L 248,240
           L 260,350
           L 272,280
           L 280,300
           L 325,300"
        fill="none"
        stroke="#009E2B"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
